<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#123E86">
<title>Valery · Ana C de Seguros</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --placa: #123E86;      /* azul de la cara */
    --placa-borde: #0D2F69;
    --hielo: #DDF1FF;      /* ojos */
    --cielo: #5DB2F2;      /* acentos, boca */
    --niebla: #A9CBEE;     /* texto secundario */
    --alerta: #FFC66B;
    --u: min(1vw, 1.6vh);  /* unidad que escala con la tablet */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--placa); color: var(--hielo); overflow: hidden;
    font-family: "Fredoka", "Nunito", system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body { padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0); }

  /* ---------- Cara (SVG con expresiones) ---------- */
  #cara { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer;
    background: radial-gradient(ellipse 70% 60% at 50% 42%, #1A4E9F 0%, var(--placa) 60%, var(--placa-borde) 100%); }
  .rostro { position: relative; width: calc(var(--u) * 72); margin-top: calc(var(--u) * -16); }
  .svg-cara { width: 100%; height: auto; display: block; overflow: visible; }
  #mirada { transition: transform .35s ease-out; }
  .parpadea { animation: parp 4.2s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes parp { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .rebota { animation: reb .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes reb { to { transform: translateY(-8px); } }
  .flota { animation: flo 2.4s ease-in-out infinite; }
  @keyframes flo { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
  .habla { animation: hab .22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center top; }
  @keyframes hab { to { transform: scaleY(.35); } }
  .late { animation: lat 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes lat { 50% { transform: scale(1.15); } }
  .pt { animation: pt 1.2s infinite; }
  @keyframes pt { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
  .inclina { transform: rotate(-6deg); transform-origin: 200px 130px; }

  /* Anillo de escucha */
  .anillo { position: absolute; inset: calc(var(--u) * -4) calc(var(--u) * -2); border-radius: calc(var(--u) * 14);
    border: calc(var(--u) * .5) solid var(--cielo); opacity: 0; transition: opacity .3s; pointer-events: none; }
  body[data-estado="escuchando"] .anillo { opacity: .8; animation: latido 1.2s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.03); opacity: .35; } }

  /* Subtítulo */
  #subtitulo { position: fixed; left: 50%; bottom: calc(var(--u) * 4); transform: translateX(-50%);
    width: min(80vw, 60ch); text-align: center; font-size: calc(var(--u) * 3.4); line-height: 1.35;
    font-weight: 500; color: var(--hielo); min-height: 2.7em; pointer-events: none; }
  #subtitulo.tenue { color: var(--niebla); font-weight: 400; }
  #subtitulo.error { color: var(--alerta); }

  /* Controles discretos */
  .controles { position: fixed; top: calc(var(--u) * 2.5 + env(safe-area-inset-top, 0)); right: calc(var(--u) * 2.5);
    display: flex; gap: calc(var(--u) * 1.5); opacity: .35; transition: opacity .3s; }
  .controles:hover, .controles:focus-within { opacity: 1; }
  .controles button { font: inherit; font-size: calc(var(--u) * 2); color: var(--hielo); background: transparent;
    border: 2px solid var(--niebla); border-radius: 999px; padding: calc(var(--u) * .8) calc(var(--u) * 2); cursor: pointer; }
  .controles button[aria-pressed="true"] { background: var(--cielo); border-color: var(--cielo); color: var(--placa-borde); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--alerta); outline-offset: 3px; }

  /* ---------- Pantalla de PIN ---------- */
  #pantalla-pin { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--placa); }
  #pantalla-pin[hidden] { display: none; }
  .tarjeta-pin { display: grid; gap: calc(var(--u) * 2.5); justify-items: center; text-align: center; width: min(90vw, 34ch); }
  .tarjeta-pin h1 { font-size: calc(var(--u) * 4.5); font-weight: 600; line-height: 1.15; }
  .tarjeta-pin p { color: var(--niebla); font-size: calc(var(--u) * 2.4); line-height: 1.4; }
  .tarjeta-pin input { width: 100%; font: inherit; font-size: calc(var(--u) * 4); text-align: center; letter-spacing: .3em;
    padding: calc(var(--u) * 1.5); border-radius: calc(var(--u) * 2); border: 3px solid var(--niebla);
    background: var(--placa-borde); color: var(--hielo); }
  .tarjeta-pin button { width: 100%; font: inherit; font-size: calc(var(--u) * 3); font-weight: 600; cursor: pointer;
    padding: calc(var(--u) * 1.6); border: 0; border-radius: calc(var(--u) * 2); background: var(--cielo); color: var(--placa-borde); }
  #error-pin { color: var(--alerta); min-height: 1.4em; font-size: calc(var(--u) * 2.4); }

  /* Modo reunión */
  #indicador-reunion { position: fixed; top: calc(var(--u) * 2.5 + env(safe-area-inset-top, 0)); left: calc(var(--u) * 2.5);
    display: none; align-items: center; gap: calc(var(--u) * 1.2); font-size: calc(var(--u) * 2.4); font-weight: 500; }
  #indicador-reunion::before { content: ""; width: calc(var(--u) * 2); height: calc(var(--u) * 2); border-radius: 50%; background: #FF5A5F;
    animation: grabando 1.6s ease-in-out infinite; }
  body.en-reunion #indicador-reunion { display: flex; }
  body.en-reunion .anillo { opacity: 0 !important; animation: none; }
  body.en-reunion .controles { opacity: 1; }
  #btn-reunion[aria-pressed="true"] { background: #FF5A5F; border-color: #FF5A5F; color: #fff; }
  @keyframes grabando { 50% { opacity: .35; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body data-estado="dormido">

<main id="cara" aria-label="Cara de Valery. Toca para hablar.">
  <div class="rostro">
    <div class="anillo"></div>
    <svg class="svg-cara" viewBox="0 0 400 260" aria-hidden="true"><g id="mirada"><g id="rostro"></g></g></svg>
  </div>
</main>

<p id="subtitulo" class="tenue" aria-live="polite">Toca mi cara para hablar</p>

<div id="indicador-reunion" aria-live="polite">Grabando reunión <span id="tiempo-reunion">00:00</span></div>

<div class="controles">
  <button id="btn-reunion" type="button" aria-pressed="false">Reunión</button>
  <button id="btn-camara" type="button" aria-pressed="false">Cámara</button>
  <button id="btn-pantalla" type="button">Pantalla completa</button>
</div>

<section id="pantalla-pin" hidden>
  <form class="tarjeta-pin" id="form-pin" autocomplete="off">
    <h1>Valery · Ana C de Seguros</h1>
    <p>Escribe el PIN para activarla. Solo se pide una vez en esta tablet.</p>
    <input id="input-pin" type="password" inputmode="numeric" aria-label="PIN" required>
    <button type="submit">Activar robot</button>
    <div id="error-pin" role="alert"></div>
  </form>
</section>

<script>
(() => {
  "use strict";

  // ---------- Configuración ----------
  const SALUDO_INICIAL = "¡Hola! Soy Valery, la asistente de Ana Carolina, corredora de seguros. Toca mi cara cuando me necesites.";
  const SALUDO_PRESENCIA = "¡Hola! Si necesitas algo, toca mi cara.";
  const MINUTOS_REINICIO = 10;        // olvida la conversación tras este tiempo sin uso
  const SEGUNDOS_ENTRE_SALUDOS = 120; // no saludar por movimiento más seguido que esto

  const $ = (id) => document.getElementById(id);
  const cuerpo = document.body;
  const subtitulo = $("subtitulo");

  let pin = "";
  try { pin = localStorage.getItem("robotPin") || ""; } catch {}
  let historial = [];
  let ultimoUso = Date.now();
  let reconocedor = null;
  let ultimoSaludo = 0;
  let activo = false;

  // ---------- Estados y subtítulos ----------
  // ---------- Expresiones de la cara ----------
  const O = "#DDF1FF", AC = "#5DB2F2";
  const ojosOval = (g) => { const h = g ? 62 : 52, w = g ? 46 : 40; return `<g class="parpadea"><rect x="${130 - w / 2}" y="70" width="${w}" height="${h}" rx="${w / 2}" fill="${O}"/><rect x="${270 - w / 2}" y="70" width="${w}" height="${h}" rx="${w / 2}" fill="${O}"/></g>`; };
  const ojosArco = () => `<path d="M106 112 Q130 76 154 112" fill="none" stroke="${O}" stroke-width="14" stroke-linecap="round"/><path d="M246 112 Q270 76 294 112" fill="none" stroke="${O}" stroke-width="14" stroke-linecap="round"/>`;
  const corazon = (x, y, s) => `<path class="late" d="M${x} ${y + 12 * s} C${x - 30 * s} ${y - 12 * s} ${x - 16 * s} ${y - 34 * s} ${x} ${y - 18 * s} C${x + 16 * s} ${y - 34 * s} ${x + 30 * s} ${y - 12 * s} ${x} ${y + 12 * s} Z" fill="${O}"/>`;
  const CARAS = {
    sonrisa: () => ojosOval() + `<path d="M168 178 Q200 206 232 178" fill="none" stroke="${O}" stroke-width="10" stroke-linecap="round"/>`,
    feliz: () => ojosArco() + `<path d="M160 168 Q200 168 240 168 Q236 214 200 214 Q164 214 160 168 Z" fill="${O}"/>`,
    guino: () => `<g class="parpadea"><rect x="110" y="70" width="40" height="52" rx="20" fill="${O}"/></g><path d="M248 104 Q270 84 292 104" fill="none" stroke="${O}" stroke-width="14" stroke-linecap="round"/><path d="M170 180 Q206 204 236 172" fill="none" stroke="${O}" stroke-width="10" stroke-linecap="round"/>`,
    enamorada: () => corazon(130, 100, 1.3) + corazon(270, 100, 1.3) + `<path d="M172 178 Q200 202 228 178" fill="none" stroke="${O}" stroke-width="10" stroke-linecap="round"/>`,
    riendo: () => `<g class="rebota"><path d="M108 82 L150 100 L108 118" fill="none" stroke="${O}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M292 82 L250 100 L292 118" fill="none" stroke="${O}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 160 Q200 160 246 160 Q240 222 200 222 Q160 222 154 160 Z" fill="${O}"/></g>`,
    escuchando: () => `<g class="inclina">${ojosOval(true)}<ellipse cx="200" cy="186" rx="14" ry="12" fill="${O}"/></g>`,
    pensando: () => `<rect x="120" y="66" width="40" height="40" rx="20" fill="${O}"/><rect x="260" y="66" width="40" height="40" rx="20" fill="${O}"/><path d="M180 186 Q204 178 224 190" fill="none" stroke="${O}" stroke-width="10" stroke-linecap="round"/><circle class="pt" cx="318" cy="46" r="7" fill="${AC}"/><circle class="pt" cx="340" cy="34" r="9" fill="${AC}" style="animation-delay:.2s"/><circle class="pt" cx="366" cy="20" r="11" fill="${AC}" style="animation-delay:.4s"/>`,
    sorprendida: () => `<circle cx="130" cy="98" r="30" fill="${O}"/><circle cx="270" cy="98" r="30" fill="${O}"/><ellipse cx="200" cy="190" rx="18" ry="22" fill="${O}"/>`,
    hablando: () => ojosOval() + `<path id="boca-viva" d="${trazoBoca(0, 1)}" fill="${O}"/>`,
    dormida: () => `<path d="M108 100 Q130 118 152 100" fill="none" stroke="${O}" stroke-width="12" stroke-linecap="round"/><path d="M248 100 Q270 118 292 100" fill="none" stroke="${O}" stroke-width="12" stroke-linecap="round"/><ellipse cx="200" cy="184" rx="10" ry="7" fill="${O}"/><text class="flota" x="320" y="70" font-size="30" font-weight="500" fill="${AC}">z</text><text class="flota" x="342" y="50" font-size="22" font-weight="500" fill="${AC}" style="animation-delay:.8s">z</text>`,
  };
  const MAPA_CARAS = { dormido: "dormida", reposo: "sonrisa", escuchando: "escuchando", pensando: "pensando", hablando: "hablando",
    feliz: "feliz", guino: "guino", enamorada: "enamorada", riendo: "riendo", sorprendida: "sorprendida" };
  const EMOCIONES = ["feliz", "guino", "enamorada", "riendo", "sorprendida"];
  let caraActual = "";
  function estado(e) {
    cuerpo.dataset.estado = e;
    const k = MAPA_CARAS[e] || "sonrisa";
    if (k !== caraActual) { caraActual = k; $("rostro").innerHTML = CARAS[k](); }
  }
  function texto(t, tipo = "") { subtitulo.textContent = t; subtitulo.className = tipo; }
  function reposo() { estado("reposo"); texto("Toca mi cara para hablar", "tenue"); }

  // ---------- Parpadeo y mirada ----------
  function mirar(x, y = 0) {
    const mx = Math.max(-1, Math.min(1, x)) * 14, my = Math.max(-1, Math.min(1, y)) * 8;
    $("mirada").style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
  }
  // Mirada errante cuando no hay cámara
  setInterval(() => { if (!camaraActiva && cuerpo.dataset.estado === "reposo") mirar(Math.random() * 1.6 - .8, Math.random() * .6 - .3); }, 4000);

  // ---------- Voz (texto a voz) ----------
  let voz = null;
  function elegirVoz() {
    const voces = speechSynthesis.getVoices();
    let preferida = ""; try { preferida = localStorage.getItem("robotVoz") || ""; } catch {}
    voz = (preferida && voces.find(v => v.voiceURI === preferida || v.name === preferida)) ||
          voces.find(v => v.lang === "es-CO") || voces.find(v => v.lang === "es-US") ||
          voces.find(v => v.lang === "es-MX") || voces.find(v => v.lang && v.lang.startsWith("es")) || null;
  }
  if ("speechSynthesis" in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

  // Voz: primero la costeña de ElevenLabs (/api/voz); si no está disponible, la de la tablet
  let audioActual = null;
  let caraHablando = "hablando";
  let vozNube = true;
  function callar() {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (audioActual) { const a = audioActual; audioActual = null; a.pause(); }
  }
  let expresionFinal = "feliz";
  // ---------- Labios sincronizados con la voz ----------
  // Voz de la nube: se mide el volumen real del audio. Voz de la tablet: se leen las vocales del texto,
  // y cada vez que el navegador avisa que empieza una palabra, la boca se vuelve a sincronizar.
  const labios = { o: 0, w: 1, objO: 0, objW: 1, plan: null, analizador: null, datos: null };
  function trazoBoca(o, w) {
    const ancho = 18 + 18 * w, alto = 3 + 36 * o, y = 176;
    return `M${200 - ancho} ${y} Q200 ${y + 4 - 8 * o} ${200 + ancho} ${y} Q${200 + ancho - 4} ${y + alto} 200 ${y + alto} Q${200 - ancho + 4} ${y + alto} ${200 - ancho} ${y} Z`;
  }
  function visema(c) {
    if (!c) return { o: 0, w: 1 };
    c = c.toLowerCase();
    if ("aá".includes(c)) return { o: 1, w: 1 };
    if ("eéiíy".includes(c)) return { o: .55, w: 1.2 };
    if ("oóuúü".includes(c)) return { o: .75, w: .45 };
    if ("mbpv".includes(c)) return { o: 0, w: .9 };
    if (/[\s,.;:!?¡¿…-]/.test(c)) return { o: .04, w: 1 };
    return { o: .25, w: .95 };
  }
  function planDeTexto(texto, velocidad) {
    const msBase = 1000 / (14.5 * velocidad); // ~14 letras por segundo a velocidad normal
    const tiempos = []; let t = 0;
    for (const c of texto) {
      tiempos.push(t);
      t += msBase * (/[,;:]/.test(c) ? 4 : /[.!?…]/.test(c) ? 6 : c === " " ? .7 : 1);
    }
    return { texto, tiempos, t0: performance.now() };
  }
  function cicloLabios() {
    if (labios.analizador) {
      labios.analizador.getByteTimeDomainData(labios.datos);
      let s = 0;
      for (let i = 0; i < labios.datos.length; i++) { const v = (labios.datos[i] - 128) / 128; s += v * v; }
      const rms = Math.sqrt(s / labios.datos.length);
      labios.objO = Math.min(1, Math.max(0, (rms - .015) * 7));
      labios.objW = .7 + .4 * labios.objO;
    } else if (labios.plan) {
      const p = labios.plan, trans = performance.now() - p.t0;
      let i = 0; while (i < p.tiempos.length - 1 && p.tiempos[i + 1] <= trans) i++;
      const v = trans > p.tiempos[p.tiempos.length - 1] + 300 ? { o: 0, w: 1 } : visema(p.texto[i]);
      labios.objO = v.o; labios.objW = v.w;
    } else { labios.objO = 0; labios.objW = 1; }
    labios.o += (labios.objO - labios.o) * .45;
    labios.w += (labios.objW - labios.w) * .35;
    const boca = document.getElementById("boca-viva");
    if (boca) boca.setAttribute("d", trazoBoca(labios.o, labios.w));
    requestAnimationFrame(cicloLabios);
  }
  requestAnimationFrame(cicloLabios);

  let ctxAudio = null;
  function conectarAnalizador(a) {
    try {
      ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
      if (ctxAudio.state === "suspended") ctxAudio.resume();
      const fuente = ctxAudio.createMediaElementSource(a);
      const an = ctxAudio.createAnalyser();
      an.fftSize = 1024;
      fuente.connect(an); an.connect(ctxAudio.destination);
      labios.analizador = an; labios.datos = new Uint8Array(an.fftSize);
    } catch { labios.analizador = null; }
  }
  function soltarLabios() { labios.plan = null; labios.analizador = null; }

  function alTerminar() {
    soltarLabios(); if (["hablando", "riendo"].includes(cuerpo.dataset.estado)) { estado(expresionFinal); reposoTras(2200); } }
  const esperar = (ms) => new Promise((ok) => setTimeout(ok, ms));

  async function decir(t, expresion) {
    texto(t);
    callar();
    const emo = EMOCIONES.includes(expresion) ? expresion : null;
    expresionFinal = emo || "feliz";
    caraHablando = emo === "riendo" ? "riendo" : "hablando";
    if (emo) { estado(emo); await esperar(700); }
    if (vozNube) {
      try {
        const r = await fetch("/api/voz", {
          method: "POST",
          headers: { "content-type": "application/json", "x-robot-pin": pin },
          body: JSON.stringify({ text: t })
        });
        if (r.status === 501) vozNube = false; // ElevenLabs no configurado: usar siempre la voz de la tablet
        if (r.ok) {
          const url = URL.createObjectURL(await r.blob());
          const a = new Audio(url);
          conectarAnalizador(a);
          audioActual = a;
          const sono = await new Promise((resolver) => {
            a.onplay = () => estado(caraHablando);
            a.onended = a.onerror = a.onpause = () => { URL.revokeObjectURL(url); if (audioActual === a) audioActual = null; alTerminar(); resolver(true); };
            a.play().catch(() => { if (audioActual === a) audioActual = null; resolver(false); });
          });
          if (sono) return;
        }
      } catch {}
    }
    return decirLocal(t);
  }

  // Voz de la tablet: habla por frases para que las historias largas no se corten
  function decirLocal(t) {
    return new Promise((resolver) => {
      if (!("speechSynthesis" in window)) { reposoTras(4000); return resolver(); }
      speechSynthesis.cancel();
      const frases = (t.match(/[^.!?¡¿]+[.!?]+|[^.!?]+$/g) || [t]).map(f => f.trim()).filter(Boolean);
      const lotes = [];
      for (const f of frases) {
        if (lotes.length && (lotes[lotes.length - 1] + " " + f).length < 180) lotes[lotes.length - 1] += " " + f;
        else lotes.push(f);
      }
      const velocidad = parseFloat(localStorage.getItem("robotVelocidad")) || 1.02;
      const tono = parseFloat(localStorage.getItem("robotTono")) || 1.15;
      lotes.forEach((trozo, i) => {
        const u = new SpeechSynthesisUtterance(trozo);
        u.lang = voz ? voz.lang : "es-CO";
        if (voz) u.voice = voz;
        u.rate = velocidad; u.pitch = tono;
        u.onstart = () => { if (i === 0) estado(caraHablando); labios.plan = planDeTexto(trozo, velocidad); };
        u.onboundary = (e) => {
          const p = labios.plan;
          if (p && p.texto === trozo && typeof e.charIndex === "number" && p.tiempos[e.charIndex] != null) p.t0 = performance.now() - p.tiempos[e.charIndex];
        };
        if (i === lotes.length - 1) u.onend = () => { alTerminar(); resolver(); };
        u.onerror = (e) => { if (e.error !== "interrupted" && e.error !== "canceled") console.warn("Voz:", e.error); alTerminar(); resolver(); };
        speechSynthesis.speak(u);
      });
    });
  }

  let temporizadorReposo;
  function reposoTras(ms) { clearTimeout(temporizadorReposo); temporizadorReposo = setTimeout(() => { if (["hablando", ...EMOCIONES].includes(cuerpo.dataset.estado)) reposo(); }, ms); }

  // ---------- Escuchar (voz a texto) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function escuchar() {
    if (!SR) { texto("Este navegador no reconoce voz. Abre el robot en Google Chrome.", "error"); return; }
    callar();
    clearTimeout(temporizadorReposo);

    reconocedor = new SR();
    reconocedor.lang = "es-CO";
    reconocedor.interimResults = true;
    reconocedor.continuous = false;
    let final = "";

    reconocedor.onstart = () => { estado("escuchando"); texto("Te escucho…", "tenue"); };
    reconocedor.onresult = (e) => {
      let parcial = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t; else parcial += t;
      }
      texto((final + parcial).trim() || "Te escucho…", final ? "" : "tenue");
    };
    reconocedor.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") texto("El micrófono está bloqueado. Permítelo en los ajustes del navegador.", "error");
      else if (e.error === "no-speech") texto("No escuché nada. Toca mi cara e inténtalo otra vez.", "tenue");
      else if (e.error === "network") texto("Sin conexión para reconocer la voz. Revisa el wifi.", "error");
    };
    reconocedor.onend = () => {
      reconocedor = null;
      const pregunta = final.trim();
      if (pregunta) preguntar(pregunta);
      else if (cuerpo.dataset.estado === "escuchando") estado("reposo");
    };
    try { reconocedor.start(); } catch { reconocedor = null; }
  }

  // ---------- Agente Claude ----------
  async function preguntar(p) {
    if (Date.now() - ultimoUso > MINUTOS_REINICIO * 60000) historial = [];
    ultimoUso = Date.now();
    historial.push({ role: "user", content: p });
    estado("pensando");
    texto(p);
    const avisoLento = setTimeout(() => { if (cuerpo.dataset.estado === "pensando") texto("Déjame averiguar eso…", "tenue"); }, 4000);

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json", "x-robot-pin": pin },
        body: JSON.stringify({ messages: historial.slice(-20) })
      });
      const datos = await r.json().catch(() => ({}));
      clearTimeout(avisoLento);
      if (r.status === 401) { historial.pop(); pedirPin("El PIN ya no es válido. Escríbelo de nuevo."); return; }
      if (!r.ok) {
        historial.pop();
        if (datos.codigo === "config") { estado("reposo"); texto("Falta configurar el robot en Vercel (llave o PIN).", "error"); return; }
        await decir("Tuve un problema para conectarme. Intenta de nuevo en un momento.");
        return;
      }
      historial.push({ role: "assistant", content: datos.reply });
      ultimoUso = Date.now();
      await decir(datos.reply, datos.expresion);
    } catch {
      clearTimeout(avisoLento);
      historial.pop();
      estado("reposo");
      texto("Sin conexión a internet. Revisa el wifi de la tablet.", "error");
    }
  }

  // ---------- Toque en la cara ----------
  $("cara").addEventListener("click", () => {
    if (!activo || reunion) return;
    const e = cuerpo.dataset.estado;
    if (e === "escuchando" && reconocedor) { reconocedor.stop(); return; }
    if (e === "pensando") return;
    escuchar(); // si está hablando, lo interrumpe y escucha
  });

  // ---------- Cámara: detecta movimiento y sigue con la mirada ----------
  let camaraActiva = false, flujo = null, bucle = null;
  const video = document.createElement("video");
  video.muted = true; video.playsInline = true;
  const lienzo = document.createElement("canvas");
  const AN = 32, AL = 24;
  lienzo.width = AN; lienzo.height = AL;
  const ctx = lienzo.getContext("2d", { willReadFrequently: true });
  let anterior = null, quietoDesde = Date.now();

  async function encenderCamara() {
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 }, audio: false });
      video.srcObject = flujo;
      await video.play();
      camaraActiva = true;
      $("btn-camara").setAttribute("aria-pressed", "true");
      try { localStorage.setItem("robotCamara", "1"); } catch {}
      bucle = setInterval(analizar, 200);
    } catch {
      texto("No pude usar la cámara. Revisa el permiso del navegador.", "error");
    }
  }
  function apagarCamara() {
    clearInterval(bucle);
    if (flujo) flujo.getTracks().forEach(t => t.stop());
    flujo = null; anterior = null; camaraActiva = false;
    $("btn-camara").setAttribute("aria-pressed", "false");
    try { localStorage.setItem("robotCamara", "0"); } catch {}
  }
  function analizar() {
    if (video.readyState < 2) return;
    ctx.drawImage(video, 0, 0, AN, AL);
    const px = ctx.getImageData(0, 0, AN, AL).data;
    const gris = new Uint8Array(AN * AL);
    for (let i = 0; i < gris.length; i++) gris[i] = (px[i * 4] * 3 + px[i * 4 + 1] * 6 + px[i * 4 + 2]) / 10;
    if (anterior) {
      let cambios = 0, sumaX = 0, sumaY = 0;
      for (let i = 0; i < gris.length; i++) {
        if (Math.abs(gris[i] - anterior[i]) > 28) { cambios++; sumaX += i % AN; sumaY += (i / AN) | 0; }
      }
      if (cambios > gris.length * 0.04) {
        // La cámara frontal se ve en espejo: invertimos X para que mire hacia la persona
        const x = -((sumaX / cambios) / (AN - 1) * 2 - 1);
        const y = (sumaY / cambios) / (AL - 1) * 2 - 1;
        if (activo && cuerpo.dataset.estado === "dormido" && !reunion) reposo();
        if (cuerpo.dataset.estado === "reposo") mirar(x, y * .6);
        const llegoAlguien = Date.now() - quietoDesde > 15000;
        if (llegoAlguien && !reunion && cuerpo.dataset.estado === "reposo" && Date.now() - ultimoSaludo > SEGUNDOS_ENTRE_SALUDOS * 1000) {
          ultimoSaludo = Date.now();
          decir(SALUDO_PRESENCIA, "feliz");
        }
        quietoDesde = Date.now();
      }
    }
    anterior = gris;
  }
  $("btn-camara").addEventListener("click", (e) => { e.stopPropagation(); camaraActiva ? apagarCamara() : encenderCamara(); });

  // ---------- Modo reunión: graba, transcribe por tramos y envía resumen al correo ----------
  const AVISO_REUNION = "Les aviso que voy a grabar esta reunión para hacer el resumen. Cuando terminen, toquen el botón Terminar.";
  const TRAMO_MS = 120000; // tramos de 2 minutos (Vercel no acepta archivos grandes)
  let reunion = null;

  function formatoTiempo(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0");
  }
  function tipoAudio() {
    for (const t of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    return "";
  }

  async function transcribirTramo(blob, indice, intento = 1) {
    try {
      const r = await fetch("/api/transcribir", { method: "POST", headers: { "content-type": blob.type || "audio/webm", "x-robot-pin": pin }, body: blob });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || r.status);
      reunion.textos[indice] = d.texto || "";
    } catch (e) {
      if (intento < 3) { await new Promise(ok => setTimeout(ok, 3000 * intento)); return transcribirTramo(blob, indice, intento + 1); }
      reunion.textos[indice] = `[Tramo ${indice + 1} sin transcribir]`;
    }
  }

  function grabarTramo() {
    if (!reunion || reunion.terminando) return;
    const rec = new MediaRecorder(reunion.flujo, { mimeType: reunion.tipo || undefined, audioBitsPerSecond: 32000 });
    const partes = [];
    const indice = reunion.tramos++;
    rec.ondataavailable = (e) => { if (e.data && e.data.size) partes.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(partes, { type: rec.mimeType || "audio/webm" });
      if (blob.size > 2000) reunion.pendientes.push(transcribirTramo(blob, indice));
      else reunion.textos[indice] = "";
      if (!reunion.terminando) grabarTramo(); // empieza el siguiente tramo de inmediato
    };
    reunion.rec = rec;
    rec.start();
    reunion.corte = setTimeout(() => { if (rec.state === "recording") rec.stop(); }, TRAMO_MS);
  }

  async function iniciarReunion() {
    if (!window.MediaRecorder) { texto("Este navegador no puede grabar audio. Usa Google Chrome.", "error"); return; }
    if (reconocedor) reconocedor.abort();
    let flujo;
    try { flujo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch { texto("No pude usar el micrófono. Revisa el permiso del navegador.", "error"); return; }
    await decir(AVISO_REUNION);
    reunion = { flujo, tipo: tipoAudio(), textos: [], pendientes: [], tramos: 0, inicio: Date.now(), terminando: false };
    cuerpo.classList.add("en-reunion");
    $("btn-reunion").setAttribute("aria-pressed", "true");
    $("btn-reunion").textContent = "Terminar";
    estado("escuchando");
    texto("Estoy grabando la reunión", "tenue");
    reunion.reloj = setInterval(() => { $("tiempo-reunion").textContent = formatoTiempo(Date.now() - reunion.inicio); }, 1000);
    grabarTramo();
    mantenerEncendida();
  }

  async function terminarReunion() {
    const r = reunion;
    r.terminando = true;
    clearTimeout(r.corte);
    clearInterval(r.reloj);
    const ultimoTramo = new Promise((ok) => { if (r.rec && r.rec.state === "recording") { r.rec.addEventListener("stop", () => setTimeout(ok, 50), { once: true }); r.rec.stop(); } else ok(); });
    await ultimoTramo;
    r.flujo.getTracks().forEach(t => t.stop());
    cuerpo.classList.remove("en-reunion");
    $("btn-reunion").setAttribute("aria-pressed", "false");
    $("btn-reunion").textContent = "Reunión";
    estado("pensando");
    texto("Terminando de escuchar la reunión…", "tenue");
    await Promise.all(r.pendientes);
    const datos = {
      transcripcion: r.textos.filter(Boolean).join("\n"),
      fecha: new Date(r.inicio).toLocaleString("es-CO", { dateStyle: "long", timeStyle: "short" }),
      duracion: formatoTiempo(Date.now() - r.inicio)
    };
    reunion = null;
    if (datos.transcripcion.replace(/\[Tramo \d+ sin transcribir\]/g, "").trim().length < 20) {
      await decir("No alcancé a entender nada de la reunión. Revisa que el micrófono esté cerca.");
      return;
    }
    try { localStorage.setItem("robotUltimaReunion", JSON.stringify(datos)); } catch {}
    await enviarResumen(datos);
  }

  async function enviarResumen(datos) {
    estado("pensando");
    texto("Preparando el resumen…", "tenue");
    try {
      const r = await fetch("/api/resumen", { method: "POST", headers: { "content-type": "application/json", "x-robot-pin": pin }, body: JSON.stringify(datos) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Error");
      try { localStorage.removeItem("robotUltimaReunion"); } catch {}
      $("btn-reunion").textContent = "Reunión";
      const tareas = d.tareas ? ` Quedaron ${d.tareas} tareas anotadas.` : "";
      await decir("Listo, te envié el resumen al correo." + tareas);
    } catch (e) {
      $("btn-reunion").textContent = "Reenviar resumen";
      estado("reposo");
      texto((e.message || "No se pudo enviar el resumen.") + " Toca Reenviar resumen para intentarlo de nuevo.", "error");
    }
  }

  $("btn-reunion").addEventListener("click", (e) => {
    e.stopPropagation();
    if (!activo) return;
    if (reunion && !reunion.terminando) { terminarReunion(); return; }
    if (reunion) return;
    let pendiente = null;
    try { pendiente = JSON.parse(localStorage.getItem("robotUltimaReunion") || "null"); } catch {}
    if (pendiente && $("btn-reunion").textContent === "Reenviar resumen") { enviarResumen(pendiente); return; }
    iniciarReunion();
  });

  // ---------- Pantalla completa y pantalla siempre encendida ----------
  $("btn-pantalla").addEventListener("click", (e) => {
    e.stopPropagation();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.("landscape").catch(() => {})).catch(() => {});
  });
  let bloqueo = null;
  async function mantenerEncendida() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") bloqueo = await navigator.wakeLock.request("screen"); } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") mantenerEncendida(); });

  estado("dormido");

  // ---------- PIN y arranque ----------
  function pedirPin(mensaje = "") {
    activo = false;
    estado("dormido");
    $("error-pin").textContent = mensaje;
    $("pantalla-pin").hidden = false;
    $("input-pin").value = "";
    setTimeout(() => $("input-pin").focus(), 50);
  }
  $("form-pin").addEventListener("submit", (e) => {
    e.preventDefault();
    pin = $("input-pin").value.trim();
    if (!pin) return;
    try { localStorage.setItem("robotPin", pin); } catch {}
    $("pantalla-pin").hidden = true;
    despertar();
  });

  let primeraVez = true;
  async function despertar() {
    activo = true;
    mantenerEncendida();
    let usarCamara = true;
    try { usarCamara = localStorage.getItem("robotCamara") !== "0"; } catch {}
    if (usarCamara && !camaraActiva) encenderCamara();
    reposo();
    if (primeraVez) { primeraVez = false; ultimoSaludo = Date.now(); decir(SALUDO_INICIAL, "feliz"); }
  }

  setInterval(() => {
    if (activo && !reunion && cuerpo.dataset.estado === "reposo" && Date.now() - Math.max(ultimoUso, quietoDesde) > 10 * 60000) {
      estado("dormido"); texto("Toca mi cara para despertarme", "tenue");
    }
  }, 30000);

  if (pin) {
    // Los navegadores exigen un toque antes de hablar: el primer toque despierta al robot
    estado("dormido");
    texto("Toca la pantalla para despertarme", "tenue");
    $("cara").addEventListener("click", function primerToque() {
      $("cara").removeEventListener("click", primerToque);
      despertar();
    });
  } else {
    pedirPin();
  }
})();
</script>
</body>
</html>
